<div class="login-wrapper">
  <div class="login-box">
    <h1>📋 Staff Management</h1>
    <p class="subtitle">Create your account via Keycloak</p>

    <button class="btn btn-success" (click)="register()" style="margin-bottom:14px;">
      📝 Register with Keycloak
    </button>

    <div class="link-text">
      Already have an account? <a routerLink="/auth/login">Login</a>
    </div>
  </div>
</div>
