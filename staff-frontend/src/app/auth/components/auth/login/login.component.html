<div class="login-wrapper">
  <div class="login-box">
    <h1>📋 Staff Management</h1>
    <p class="subtitle">Click below to sign in via Keycloak</p>

    <button class="btn btn-primary" (click)="login()" style="margin-bottom:14px;">
      🔐 Login with Keycloak
    </button>

    <div class="link-text">
      New user? <a routerLink="/auth/register">Register an account</a>
    </div>
  </div>
</div>
